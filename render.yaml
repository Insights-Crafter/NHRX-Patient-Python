services:
  - type: web
    name: nhrx-patient-api
    runtime: python
    plan: free
    branch: deployment
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: PGSSLMODE
        value: require
      - key: PGCHANNELBINDING
        value: require
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AES_SIV_KEY
        sync: false
      - key: DOCTOR_PASSWORD_SETUP_KEY
        sync: false
      - key: CREATE_DB_TABLES
        value: "false"
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_PATIENT_BUCKET
        sync: false
      - key: R2_REPORTS_ENDPOINT
        sync: false
      - key: R2_REPORTS_ACCESS_KEY_ID
        sync: false
      - key: R2_REPORTS_SECRET_ACCESS_KEY
        sync: false
      - key: R2_REPORTS_BUCKET
        sync: false
      - key: R2_REPORTS_REGION
        value: auto
      - key: R2_LAB_REPORTS_PREFIX
        value: Lab-Reports/
      - key: R2_RADIOLOGY_REPORTS_PREFIX
        value: Radiology-Reports/
      - key: R2_PRESCRIPTIONS_PREFIX
        value: prescriptions/
